# InterviewAI Pro — free public deploy on Render
# Docs: docs/deploy-free.md
#
# API uses native Python (free-tier friendly). Static publish path is repo-root relative.

services:
  - type: web
    name: interviewai-pro-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/render_start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: FORCE_SYNC_JOBS
        value: "true"
      - key: BILLING_FORCE_LOCAL
        value: "true"
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./storage/local
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: FRONTEND_URL
        value: https://interviewai-pro-web.onrender.com
      - key: CORS_ORIGINS
        value: https://interviewai-pro-web.onrender.com
      - key: SEED_DEMO_ENABLED
        value: "true"

  - type: web
    name: interviewai-pro-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://interviewai-pro-api.onrender.com/api/v1
      - key: VITE_WS_BASE_URL
        value: wss://interviewai-pro-api.onrender.com
      - key: SKIP_INSTALL_DEPS
        value: "true"
