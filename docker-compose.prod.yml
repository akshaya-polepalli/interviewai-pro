# InterviewAI Pro — production-like stack
# Usage:
#   cp .env.example .env   # set strong SECRET_KEY, APP_ENV=production, APP_DEBUG=false
#   docker compose -f docker-compose.prod.yml up --build -d
#   docker compose -f docker-compose.prod.yml exec api alembic upgrade head
#   docker compose -f docker-compose.prod.yml exec api python -m app.db.seed
# App: http://localhost   |  API docs: http://localhost/docs

name: interviewai-pro-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewai-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewai_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-interviewai}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewai} -d ${POSTGRES_DB:-interviewai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - interviewai-prod-net

  redis:
    image: redis:7-alpine
    container_name: interviewai-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - interviewai-prod-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: interviewai-prod-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-interviewai}:${POSTGRES_PASSWORD:-interviewai_dev_password}@postgres:5432/${POSTGRES_DB:-interviewai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    volumes:
      - api_prod_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - interviewai-prod-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: interviewai-prod-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-interviewai}:${POSTGRES_PASSWORD:-interviewai_dev_password}@postgres:5432/${POSTGRES_DB:-interviewai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - api_prod_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - interviewai-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: interviewai-prod-frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - interviewai-prod-net

  nginx:
    image: nginx:1.27-alpine
    container_name: interviewai-prod-nginx
    restart: unless-stopped
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - interviewai-prod-net

volumes:
  postgres_prod_data:
  redis_prod_data:
  api_prod_storage:

networks:
  interviewai-prod-net:
    driver: bridge
