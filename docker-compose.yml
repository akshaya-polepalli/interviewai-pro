# InterviewAI Pro — local development stack
# Usage: docker compose up --build
# API: http://localhost:8000  |  Docs: http://localhost:8000/docs  |  App: http://localhost:5173

name: interviewai-pro

services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewai_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-interviewai}
    ports:
      # Host 5433 avoids clashing with a local Postgres already on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewai} -d ${POSTGRES_DB:-interviewai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - interviewai-net

  redis:
    image: redis:7-alpine
    container_name: interviewai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - interviewai-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: interviewai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-interviewai}:${POSTGRES_PASSWORD:-interviewai_dev_password}@postgres:5432/${POSTGRES_DB:-interviewai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - interviewai-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: interviewai-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-interviewai}:${POSTGRES_PASSWORD:-interviewai_dev_password}@postgres:5432/${POSTGRES_DB:-interviewai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - interviewai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: interviewai-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    networks:
      - interviewai-net

  # Optional reverse proxy for production-like local testing:
  # docker compose --profile prod-proxy up nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: interviewai-nginx
    profiles: ["prod-proxy"]
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - interviewai-net

volumes:
  postgres_data:
  redis_data:
  api_storage:
  frontend_node_modules:

networks:
  interviewai-net:
    driver: bridge
